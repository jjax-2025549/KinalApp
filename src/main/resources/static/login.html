<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinalApp - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<div class="container">
    <div class="auth-card card">
        <div class="auth-header">
            <h3>🏫 KINAL APP</h3>
            <p>Sistema de Gestión 2026</p>
        </div>
        <div class="card-body p-4">

            <div id="alerta" class="alert d-none mb-3"></div>

            <h5 class="mb-4 text-center text-secondary">Iniciar Sesión</h5>

            <div class="mb-3">
                <label class="form-label fw-semibold">Usuario</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Tu nombre de usuario">
                <div class="invalid-feedback d-none" id="err-username">El usuario es obligatorio</div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Contraseña</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Tu contraseña">
                <div class="invalid-feedback d-none" id="err-password">La contraseña es obligatoria</div>
            </div>

            <button class="btn btn-kinal mt-2 w-100" onclick="iniciarSesion()">
                Iniciar Sesión
            </button>

            <hr>
            <p class="text-center mb-0 text-muted">
                ¿No tienes cuenta?
                <a href="registro.html" class="text-decoration-none fw-semibold">Regístrate aquí</a>
            </p>
        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('error')) mostrarAlerta('Usuario o contraseña incorrectos', 'danger');
    if (params.get('logout')) mostrarAlerta('Sesión cerrada correctamente', 'success');

    function mostrarAlerta(msg, tipo) {
        const a = document.getElementById('alerta');
        a.className = `alert alert-${tipo}`;
        a.classList.remove('d-none');
        a.textContent = msg;
    }

    function validar() {
        let ok = true;
        const u = document.getElementById('username');
        const p = document.getElementById('password');
        const eu = document.getElementById('err-username');
        const ep = document.getElementById('err-password');

        u.classList.remove('is-invalid'); eu.classList.add('d-none');
        p.classList.remove('is-invalid'); ep.classList.add('d-none');

        if (!u.value.trim()) {
            u.classList.add('is-invalid'); eu.classList.remove('d-none'); ok = false;
        }
        if (!p.value.trim()) {
            p.classList.add('is-invalid'); ep.classList.remove('d-none'); ok = false;
        }
        return ok;
    }

    function iniciarSesion() {
        if (!validar()) return;

        // Construimos los parámetros URL-encoded exactos que Spring Security exige
        const data = new URLSearchParams();
        data.append('username', document.getElementById('username').value.trim());
        data.append('password', document.getElementById('password').value);

        fetch('/api/auth/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: data.toString(), // Enviamos el string codificado puro
            credentials: 'include'
        })
        .then(response => {
            // Si el backend (SecurityConfig) responde con el JSON de éxito (200 OK)
            if (response.ok) {
                window.location.href = '/dashboard.html';
            } else {
                mostrarAlerta('Usuario o contraseña incorrectos', 'danger');
            }
        })
        .catch(() => mostrarAlerta('Error de conexión con el servidor', 'danger'));
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'Enter') iniciarSesion();
    });
</script>
</body>
</html>
