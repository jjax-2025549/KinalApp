<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinalApp - Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-dark sticky-top shadow">
    <div class="container">
        <a class="navbar-brand">🧾 Ventas</a>
        <div id="nav-info"></div>
    </div>
</nav>

<div class="container py-4">
    <div id="alerta" class="alert d-none mb-3"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0">Registro de Ventas</h4>
        <button class="btn btn-success" onclick="abrirModal()">+ Nueva Venta</button>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover m-0 table-header-kinal">
                <thead>
                    <tr><th>ID</th><th>Fecha</th><th>Total</th><th>Cliente</th><th>Estado</th><th class="text-center">Acciones</th></tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal nueva venta -->
<div class="modal fade" id="modalVenta" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header" style="background:var(--kinal-azul);color:white">
                <h5 class="modal-title">Nueva Venta</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Fecha <span class="text-danger">*</span></label>
                    <input type="date" id="venta-fecha" class="form-control">
                    <div class="invalid-feedback" id="err-fecha"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Total (Q) <span class="text-danger">*</span></label>
                    <input type="number" id="venta-total" class="form-control" min="0.01" step="0.01">
                    <div class="invalid-feedback" id="err-total"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Cliente (DPI) <span class="text-danger">*</span></label>
                    <select id="venta-cliente" class="form-select">
                        <option value="">-- Selecciona un cliente --</option>
                    </select>
                    <div class="invalid-feedback" id="err-cliente"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-success" onclick="guardar()">Registrar Venta</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
<script>
    let todosLasVentas = [];
    let rolActual = 'USER';
    const modal = new bootstrap.Modal(document.getElementById('modalVenta'));

    verificarSesion().then(u => {
        if (!u) return;
        pintarNavbar(u);
        rolActual = u.rol;
        aplicarPermisos(u.rol);
        cargarVentas();
        cargarClientes();
    });

    function cargarVentas() {
        fetch('/ventas', { credentials: 'include' })
            .then(r => r.json())
            .then(data => { todosLasVentas = data; renderTabla(data); })
            .catch(() => mostrarAlerta('Error cargando ventas', 'danger'));
    }

    function cargarClientes() {
        fetch('/clientes', { credentials: 'include' })
            .then(r => r.json())
            .then(clientes => {
                const sel = document.getElementById('venta-cliente');
                clientes.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.dpiCliente;
                    opt.textContent = `${c.nombreCliente} ${c.apellidoCliente} (${c.dpiCliente})`;
                    sel.appendChild(opt);
                });
            });
    }

    function renderTabla(lista) {
        const tbody = document.getElementById('tbody');
        if (!lista.length) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">No hay ventas registradas</td></tr>';
            return;
        }
        tbody.innerHTML = lista.map(v => `
            <tr>
                <td>${v.codigoVenta}</td>
                <td>${v.fechaVenta || '—'}</td>
                <td>Q ${parseFloat(v.total || 0).toFixed(2)}</td>
                <td>${v.cliente ? v.cliente.nombreCliente + ' ' + v.cliente.apellidoCliente : '—'}</td>
                <td><span class="badge ${v.estado===1?'bg-success':'bg-secondary'}">${v.estado===1?'Activa':'Inactiva'}</span></td>
                <td class="text-center">
                    <button class="btn btn-sm btn-danger solo-admin" onclick="eliminar(${v.codigoVenta})">🗑️</button>
                </td>
            </tr>
        `).join('');
        aplicarPermisos(rolActual);
    }

    function abrirModal() {
        document.getElementById('venta-fecha').value = new Date().toISOString().split('T')[0];
        document.getElementById('venta-total').value = '';
        document.getElementById('venta-cliente').selectedIndex = 0;
        ['fecha','total','cliente'].forEach(f => {
            document.getElementById('err-'+f).textContent = '';
        });
        modal.show();
    }

    function guardar() {
        const fecha = document.getElementById('venta-fecha').value;
        const total = document.getElementById('venta-total').value;
        const dpi = document.getElementById('venta-cliente').value;
        let ok = true;

        ['fecha','total','cliente'].forEach(f => document.getElementById('err-'+f).textContent = '');

        if (!fecha) { document.getElementById('err-fecha').textContent = 'La fecha es obligatoria'; ok = false; }
        if (!total || parseFloat(total) <= 0) { document.getElementById('err-total').textContent = 'El total debe ser mayor a 0'; ok = false; }
        if (!dpi) { document.getElementById('err-cliente').textContent = 'Selecciona un cliente'; ok = false; }
        if (!ok) return;

        const body = {
            fechaVenta: fecha,
            total: parseFloat(total),
            estado: 1,
            cliente: { dpiCliente: dpi }
        };

        fetch('/ventas', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
            credentials: 'include'
        })
        .then(async r => {
            if (r.ok) {
                modal.hide();
                mostrarAlerta('Venta registrada correctamente', 'success');
                cargarVentas();
            } else {
                const data = await r.json();
                mostrarAlerta(data.error || 'Error al guardar', 'danger');
            }
        });
    }

    function eliminar(id) {
        if (!confirm('¿Eliminar esta venta?')) return;
        fetch(`/ventas/${id}`, { method: 'DELETE', credentials: 'include' })
            .then(r => {
                if (r.ok) { mostrarAlerta('Venta eliminada', 'success'); cargarVentas(); }
                else mostrarAlerta('Error al eliminar', 'danger');
            });
    }

    function mostrarAlerta(msg, tipo) {
        const a = document.getElementById('alerta');
        a.className = `alert alert-${tipo}`;
        a.textContent = msg;
        setTimeout(() => a.classList.add('d-none'), 4000);
    }
</script>
</body>
</html>
